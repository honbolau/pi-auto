name: Compatibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.99.0", "0.99.1", "1.5.0"]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Select compatibility host
        if: matrix.pi != '1.5.0'
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          "@earendil-works/pi-ai@${PI_VERSION}"
          "@earendil-works/pi-coding-agent@${PI_VERSION}"
          "@earendil-works/pi-tui@${PI_VERSION}"
      - name: Type check
        run: npm run check
      - name: Run regression tests
        run: npm test
